repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.7]
        # follow-imports=silent: type-check the files being COMMITTED, but do not fail the commit on
        # pre-existing errors in modules they merely import (this repo has type debt in datasources/,
        # providers/ and renderer.py that is unrelated to any given change).
        args: [--ignore-missing-imports, --follow-imports=silent]
        files: ^src/
  # Last line of defence before a secret or personal file becomes a commit. Runs on the staged
  # files only, so it stays fast; tests/unit/test_repo_hygiene.py re-checks everything tracked.
  - repo: local
    hooks:
      - id: no-secrets-or-personal-data
        name: block secrets, credentials and personal/channel files
        entry: python scripts/check_no_secrets.py
        language: system
        pass_filenames: true
